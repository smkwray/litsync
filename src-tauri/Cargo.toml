[package]
name = "litsync"
version = "0.1.0"
description = "LitSync - Portable Audiobook Player"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "litsync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
rusqlite = { version = "0.33", features = ["bundled"] }
lofty = "0.22"
walkdir = "2"
quick-xml = "0.38"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
